name: Publish v1.5 source from release asset

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-v1.5-source.yml'

permissions:
  contents: write

jobs:
  publish-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Retrieve existing v1.5 installer archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/bulkrr-release
          gh release download v1.5.0-beta --repo "${{ github.repository }}" --pattern '*.zip' --dir /tmp/bulkrr-release
      - name: Extract only public source and branding assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, shutil
          archives=list(Path('/tmp/bulkrr-release').glob('*.zip'))
          if len(archives)!=1:
              raise RuntimeError(f'Expected one ZIP release asset, found {len(archives)}')
          wanted={
              'bulkrr.py':'bulkrr.py',
              'install.ps1':'install.ps1',
              'Install Bulkrr.bat':'Install Bulkrr.bat',
              'requirements.txt':'requirements.txt',
              'Bulkrr.png':'assets/Bulkrr.png',
              'Bulkrr.ico':'assets/Bulkrr.ico',
              'Bulkrr-splash.png':'assets/Bulkrr-splash.png',
          }
          with zipfile.ZipFile(archives[0]) as z:
              entries={Path(name).name:name for name in z.namelist() if not name.endswith('/')}
              for name,target in wanted.items():
                  if name not in entries:
                      raise RuntimeError(f'Missing expected file in release archive: {name}')
                  dest=Path(target)
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  with z.open(entries[name]) as src, dest.open('wb') as out:
                      shutil.copyfileobj(src,out)
          PY
      - name: Validate Python source
        run: python3 -m py_compile bulkrr.py
      - name: Commit source to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bulkrr.py install.ps1 "Install Bulkrr.bat" requirements.txt assets/
          if git diff --cached --quiet; then
            echo "Source already present"
          else
            git commit -m "Publish Bulkrr v1.5 source and branding assets"
            git push
          fi
