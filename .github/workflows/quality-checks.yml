name: Bulkrr quality checks

on:
  push:
    branches:
      - main
      - refactor/readable-source
      - feature/phase2-import-experience
      - feature/phase3-library-management
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      APPDATA: /tmp/bulkrr-ci-appdata
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Linux Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q bulkrr.py bulkrr_core.py bulkrr_api.py bulkrr_imports.py bulkrr_review.py bulkrr_theme.py bulkrr_library.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
