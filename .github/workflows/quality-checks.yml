name: Bulkrr quality checks

# Run CI only when explicitly requested to avoid runner congestion.
on:
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest run per branch; older commits are superseded.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: '1'
      APPDATA: /tmp/bulkrr-ci-appdata
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Linux Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q bulkrr.py bulkrr_text.py bulkrr_core.py bulkrr_api.py bulkrr_imports.py bulkrr_review.py bulkrr_theme.py bulkrr_library.py bulkrr_bulk.py bulkrr_discovery.py bulkrr_servers.py bulkrr_updates.py bulkrr_sessions.py bulkrr_calendar.py bulkrr_collections.py bulkrr_extensions.py bulkrr_paths.py bulkrr_trending.py bulkrr_recommendations.py bulkrr_genres.py bulkrr_settings.py bulkrr_tmdb.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
