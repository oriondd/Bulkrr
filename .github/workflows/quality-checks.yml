name: Bulkrr quality checks

on:
  push:
    branches:
      - main
      - refactor/readable-source
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      APPDATA: /tmp/bulkrr-ci-appdata
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q bulkrr.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
