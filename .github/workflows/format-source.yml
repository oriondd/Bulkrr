name: Format Bulkrr source

on:
  push:
    branches:
      - refactor/readable-source
    paths:
      - .github/workflows/format-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: refactor/readable-source

      - name: Install formatter
        run: python3 -m pip install --user black==24.10.0

      - name: Format Python source
        run: python3 -m black --line-length 88 bulkrr.py

      - name: Check Python syntax
        run: python3 -m py_compile bulkrr.py

      - name: Commit formatted code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bulkrr.py
          if ! git diff --cached --quiet; then
            git commit -m "Format Bulkrr source with Black"
            git push
          fi
